<!doctype html>
<html lang="th" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#16110b" />
		<script>
			// Restore the saved color theme BEFORE first paint — without this,
			// light-theme players see a dark flash on every load.
			try {
				var t = JSON.parse(localStorage.getItem('gate.settings') || '{}').theme;
				if (t && t !== 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<!-- body must NOT carry .dark: the .dark block re-declares every token on
	     body and would override the active [data-theme] for all Tailwind
	     utilities inside it. html.dark alone feeds the dark: variants. -->
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
